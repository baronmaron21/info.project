<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Arduino Motorsteuerung</title>
    <!-- Socket.IO wird direkt vom Server geladen (nicht über CDN) -->
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
      body { font-family: Arial, sans-serif; text-align:center; margin-top:40px; }
      input[type=number] { width: 80px; font-size:16px; padding:4px; }
      button { padding:6px 12px; font-size:16px; cursor:pointer; }
      #log { margin-top:20px; color:#333; }
      
    </style>
  </head>
  
  <body>
    <h1>Motorsteuerung (0–255)</h1>
    
    <p>Gib eine Wert ein und klicke auf <strong>Senden</strong>:</p>
    <input id="speedInput" type="number" min="0" max="255" value="0" />
    <button id="sendBtn">Senden</button>

    <div id="log"></div>

    <script>
      const socket = io(); // <--- nur einmal definieren

      const input = document.getElementById('speedInpt');
      const btn = document.getElementById('sendBtn');
      const log = document.getElementById('log');

      btn.addEventListener('click', () => {
        const val = range.value;
        socket.emit('speed', val);
        addLog('Gesendet: ' + val);
      });

      function addLog(text) {
        const p = document.createElement('p');
        p.textContent = text;
        log.appendChild(p);
      }

      socket.on('connect', () => addLog('✅ Verbunden mit Server'));
      socket.on('disconnect', () => addLog('❌ Verbindung getrennt'));
    </script>
  </body>
</html>
